[package]
name = "earpop-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Microphone capture sidecar for earpop-cli (16 kHz mono PCM)"
publish = false

[dependencies]
cpal = "0.18.1"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
