# Keep matrix package / rust_target / bin aligned with src/lib/capture-platforms.json
# Tag v* → build all platforms → npm publish → GitHub Release (+ integrity commit on default branch).
# workflow_dispatch → build + assemble only (no publish).
name: Capture binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: earpop-capture-darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            bin: earpop-capture
            host_triple: true
          - package: earpop-capture-darwin-x64
            runner: macos-14
            rust_target: x86_64-apple-darwin
            bin: earpop-capture
            host_triple: false
          - package: earpop-capture-win32-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bin: earpop-capture.exe
            host_triple: true
          - package: earpop-capture-linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            bin: earpop-capture
            host_triple: true
            apt: true
          - package: earpop-capture-linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bin: earpop-capture
            host_triple: true
            apt: true

    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA headers
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build (host triple)
        if: matrix.host_triple
        run: cargo build --release -p earpop-capture

      - name: Build (cross target)
        if: ${{ !matrix.host_triple }}
        run: cargo build --release -p earpop-capture --target ${{ matrix.rust_target }}

      - name: Stage into npm package
        shell: bash
        run: |
          if [[ "${{ matrix.host_triple }}" == "true" ]]; then
            FROM="target/release/${{ matrix.bin }}"
          else
            FROM="target/${{ matrix.rust_target }}/release/${{ matrix.bin }}"
          fi
          node scripts/stage-capture.mjs --package "${{ matrix.package }}" --from "$FROM"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: npm/${{ matrix.package }}/bin/${{ matrix.bin }}
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Place binaries
        shell: bash
        run: |
          set -euo pipefail
          for dir in artifacts/earpop-capture-*; do
            pkg="$(basename "$dir")"
            mkdir -p "npm/${pkg}/bin"
            cp "$dir"/* "npm/${pkg}/bin/"
            chmod +x "npm/${pkg}/bin/"* || true
          done
          find npm -type f -path '*/bin/*' ! -name '.gitkeep' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: capture-npm-packages
          path: npm/

  publish:
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: capture-npm-packages
          path: .

      - name: Ensure executable bits
        run: |
          set -euo pipefail
          find npm -type f -path '*/bin/*' ! -name '.gitkeep' -exec chmod +x {} +
          find npm -type f -path '*/bin/*' ! -name '.gitkeep' | sort

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "Publishing ${PKG} from tag v${TAG}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Missing secret NPM_TOKEN (npm automation token with publish access)."
            exit 1
          fi
          node scripts/publish-capture.mjs --publish

      - name: npm version (no v prefix)
        id: ver
        run: echo "npm=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            npm i -g earpop-cli@${{ steps.ver.outputs.npm }}
            ```

            Platform capture packages (`earpop-capture-*`) are published as matching optional dependencies.

      - name: Commit integrity map to default branch
        env:
          INTEGRITY: src/lib/capture-integrity.json
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          cp "$INTEGRITY" /tmp/capture-integrity.json
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp /tmp/capture-integrity.json "$INTEGRITY"
          if git diff --quiet -- "$INTEGRITY"; then
            echo "Integrity map unchanged; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$INTEGRITY"
          git commit -m "chore: capture integrity for ${GITHUB_REF_NAME}"
          git push origin "HEAD:$DEFAULT_BRANCH"
